name: Desktop validation
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_AUDIO_BACKEND: pulseaudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libpulse0
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python run.py --preview
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ultron-${{ runner.os }}
          path: |
            screenshots/*.png
            dist/*.zip
            dist/*.sha256
